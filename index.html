<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VENOM MARKET</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    color:#111;
}

header{
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:8px 0 0;
}

.search{
    padding:15px;
}

.search input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

.products{
    padding:15px;
}

.product{
    background:white;
    margin-bottom:15px;
    padding:15px;
    border-radius:12px;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
}

.product h2{
    margin-top:0;
}

.price{
    font-size:20px;
    font-weight:bold;
}

button{
    margin-top:10px;
    width:100%;
    padding:12px;
    border:0;
    border-radius:10px;
    background:#111;
    color:white;
    font-size:16px;
}

</style>
</head>

<body>

<header>

<h1>VENOM MARKET</h1>

<p>Tu mercado online</p>

</header>

<div class="search">

<input
type="text"
placeholder="Buscar productos..."
>

</div>

<div class="products">

<div class="product">

<h2>Arroz</h2>

<p>1 kg</p>

<p class="price">850 CUP</p>

<button>Comprar</button>

</div>


<div class="product">

<h2>Frijoles</h2>

<p>1 kg</p>

<p class="price">940 CUP</p>

<button>Comprar</button>

</div>


<div class="product">

<h2>Picadillo</h2>

<p>1 libra</p>

<p class="price">600 CUP</p>

<button>Comprar</button>

</div>


<div class="product">

<h2>Huevos</h2>

<p>1 unidad</p>

<p class="price">180 CUP</p>

<button>Comprar</button>

</div>

</div>

</body>

</html>
